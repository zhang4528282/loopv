<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoopV Chat — 匿名聊天室</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo">LoopV Chat</span>
        <span class="room-badge">#<span id="room-name">general</span></span>
      </div>
      <div class="topbar-right">
        <span class="online-count" id="online-dot"></span>
        <span class="nickname" id="my-nickname">加载中…</span>
        <button class="btn-icon" id="btn-settings" title="更换昵称">⚙️</button>
      </div>
    </header>

    <!-- 消息区 -->
    <main class="messages" id="messages">
      <div class="messages-empty" id="messages-empty">
        <div class="empty-icon">💬</div>
        <p>暂无消息，来发第一条吧</p>
      </div>
    </main>

    <!-- 媒体预览弹窗 -->
    <div class="media-preview hidden" id="media-preview">
      <div class="media-backdrop" id="media-backdrop"></div>
      <div class="media-content" id="media-content"></div>
    </div>

    <!-- 昵称设置弹窗 -->
    <div class="modal-overlay hidden" id="settings-modal">
      <div class="modal">
        <h3>修改昵称</h3>
        <input type="text" id="nickname-input" placeholder="输入你的匿名昵称" maxlength="20" />
        <div class="modal-actions">
          <button id="btn-random-nick">🎲 随机生成</button>
          <button class="btn-primary" id="btn-save-nick">保存</button>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <footer class="input-area">
      <div class="upload-preview hidden" id="upload-preview">
        <img id="upload-preview-img" src="" alt="" />
        <button class="btn-clear" id="btn-clear-upload">✕</button>
      </div>
      <div class="input-row">
        <button class="btn-icon" id="btn-upload" title="发送图片/视频/音频">📎</button>
        <button class="btn-icon" id="btn-emoji" title="表情包">😀</button>
        <input type="file" id="file-input" accept="image/*,video/*,audio/*" class="hidden" />
        <textarea
          id="msg-input"
          placeholder="输入消息… Enter 发送，Shift+Enter 换行"
          rows="1"
          maxlength="5000"
        ></textarea>
        <button class="btn-send" id="btn-send" title="发送">➤</button>
      </div>
    </footer>
  </div>

  <!-- Emoji 选择器 -->
  <div class="emoji-picker hidden" id="emoji-picker">
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
