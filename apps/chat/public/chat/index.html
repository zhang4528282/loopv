<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LoopV Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>"
  />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- ===================== 认证视图 ===================== -->
  <div id="auth-view" class="auth-view">
    <div class="auth-glow" aria-hidden="true"></div>
    <div class="auth-card">
      <div class="auth-logo" aria-hidden="true">◈</div>
      <h1 class="auth-title">LoopV Chat</h1>
      <p class="auth-subtitle">登录或注册，加入聊天室</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tab-login" data-mode="login" type="button">登录</button>
        <button class="auth-tab" id="tab-register" data-mode="register" type="button">注册</button>
      </div>

      <form id="auth-form" novalidate autocomplete="off">
        <div class="field">
          <label for="auth-username">用户名</label>
          <input
            id="auth-username"
            type="text"
            name="username"
            placeholder="2-20 个字符"
            maxlength="20"
            autocomplete="username"
          />
        </div>

        <div class="field" id="nickname-field">
          <label for="auth-nickname">昵称 <span class="optional">选填，默认同用户名</span></label>
          <input
            id="auth-nickname"
            type="text"
            name="nickname"
            placeholder="你的昵称"
            maxlength="20"
            autocomplete="nickname"
          />
        </div>

        <div class="field">
          <label for="auth-password">密码</label>
          <input
            id="auth-password"
            type="password"
            name="password"
            placeholder="6-64 个字符"
            maxlength="64"
            autocomplete="current-password"
          />
        </div>

        <div class="auth-error" id="auth-error" role="alert"></div>

        <button class="btn-primary btn-block" id="auth-submit" type="submit">登 录</button>
      </form>
    </div>
  </div>

  <!-- ===================== 聊天视图 ===================== -->
  <div id="chat-view" class="chat-view hidden">
    <div id="app" class="app">
      <!-- 顶栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="logo">LoopV Chat</span>
          <span class="room-badge">#<span id="room-name">general</span></span>
        </div>
        <div class="topbar-right">
          <span class="conn-dot" id="conn-dot" title="连接状态"></span>
          <button class="btn-online" id="btn-online" title="在线成员" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="online-badge" id="online-count-badge">0</span>
          </button>
          <div class="me-info">
            <div class="me-avatar" id="me-avatar"></div>
            <span class="me-nickname" id="me-nickname"></span>
          </div>
          <button class="btn-icon" id="btn-settings" title="设置" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button class="btn-icon" id="btn-logout" title="退出登录" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>

      <div class="chat-body">
        <div class="chat-main">
          <!-- 消息区 -->
          <main class="messages" id="messages">
        <div class="messages-empty" id="messages-empty">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <p>暂无消息，来发第一条吧</p>
        </div>
      </main>

      <!-- 输入区 -->
      <footer class="input-area">
        <div class="upload-preview hidden" id="upload-preview">
          <div class="upload-preview-body">
            <img id="upload-preview-img" src="" alt="预览" />
            <span class="upload-preview-name" id="upload-preview-name"></span>
          </div>
          <button class="btn-clear" id="btn-clear-upload" title="移除" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="input-row">
          <button class="btn-icon btn-input" id="btn-upload" title="发送图片/视频/音频" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button class="btn-icon btn-input" id="btn-emoji" title="表情包" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <input type="file" id="file-input" accept="image/*,video/*,audio/*" class="hidden" />
          <textarea
            id="msg-input"
            placeholder="发送消息…（Enter 发送，Shift+Enter 换行）"
            rows="1"
            maxlength="5000"
          ></textarea>
          <button class="btn-send" id="btn-send" title="发送" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>

        <!-- Emoji 选择器 -->
        <div class="emoji-picker hidden" id="emoji-picker">
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>
      </footer>
        </div>

        <!-- 在线成员侧边栏 -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-head">
            <span class="sidebar-title">在线成员</span>
            <span class="sidebar-count" id="sidebar-count">0</span>
            <button class="btn-icon sidebar-close" id="btn-sidebar-close" title="关闭" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="sidebar-list" id="online-list"></div>
        </aside>
      </div>
    </div>
    <div class="online-backdrop hidden" id="online-backdrop"></div>
  </div>

  <!-- 媒体预览弹窗 -->
  <div class="media-preview hidden" id="media-preview">
    <div class="media-backdrop" id="media-backdrop"></div>
    <div class="media-content" id="media-content"></div>
    <button class="media-close" id="media-close" type="button" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal">
      <div class="modal-head">
        <h3>设置</h3>
        <button class="btn-icon" id="btn-close-settings" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="settings-avatar">
        <div class="settings-avatar-preview" id="settings-avatar-preview"></div>
        <div class="settings-avatar-actions">
          <button class="btn-secondary" id="btn-avatar-upload" type="button">更换头像</button>
          <span class="hint">仅支持图片，将自动裁剪为圆形</span>
        </div>
        <input type="file" id="avatar-input" accept="image/*" class="hidden" />
      </div>

      <div class="field">
        <label for="nickname-input">昵称</label>
        <input id="nickname-input" type="text" placeholder="输入昵称" maxlength="20" />
      </div>

      <div class="modal-actions">
        <button class="btn-primary btn-block" id="btn-save-settings" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast" role="status"></div>

  <script src="./js/app.js"></script>
</body>
</html>
