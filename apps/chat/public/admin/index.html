<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LoopV Chat 管理平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>"
  />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- ===================== 登录视图 ===================== -->
  <div id="login-view" class="auth-view">
    <div class="auth-glow" aria-hidden="true"></div>
    <div class="auth-card">
      <div class="auth-logo" aria-hidden="true">◈</div>
      <h1 class="auth-title">LoopV Chat</h1>
      <p class="auth-subtitle">管理平台 · 管理员登录</p>

      <form id="login-form" novalidate autocomplete="off">
        <div class="field">
          <label for="login-username">用户名</label>
          <input id="login-username" type="text" name="username" placeholder="管理员账号" maxlength="20" autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-password">密码</label>
          <input id="login-password" type="password" name="password" placeholder="密码" maxlength="64" autocomplete="current-password" />
        </div>
        <div class="auth-error" id="login-error" role="alert"></div>
        <button class="btn-primary btn-block" id="login-submit" type="submit">登 录</button>
      </form>
    </div>
  </div>

  <!-- ===================== 管理视图 ===================== -->
  <div id="admin-view" class="admin-view hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo">LoopV Chat <span class="logo-sub">管理平台</span></span>
      </div>
      <div class="topbar-right">
        <div class="me-info">
          <div class="me-avatar" id="me-avatar"></div>
          <span class="me-name" id="me-name"></span>
        </div>
        <span class="badge badge-admin">管理员</span>
        <button class="btn-icon" id="btn-logout" title="退出登录" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <!-- 统计卡片 -->
      <section class="stats">
        <div class="stat-card">
          <div class="stat-icon ic-users">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="stat-users">—</div>
            <div class="stat-label">用户总数</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon ic-messages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="stat-messages">—</div>
            <div class="stat-label">消息总数</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon ic-recalled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="stat-recalled">—</div>
            <div class="stat-label">已撤回消息</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon ic-deleted">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-value" id="stat-deleted">—</div>
            <div class="stat-label">已删除消息</div>
          </div>
        </div>
      </section>

      <!-- 标签页 -->
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="users" type="button">用户管理</button>
        <button class="tab" data-tab="messages" type="button">消息管理</button>
      </div>

      <!-- ===================== 用户管理 ===================== -->
      <section class="panel" id="panel-users">
        <div class="panel-toolbar">
          <button class="btn-primary btn-sm" id="btn-create-user" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            创建测试用户
          </button>
        </div>

        <div class="filter-bar">
          <div class="filter-item">
            <label for="f-username">用户名</label>
            <input id="f-username" type="text" placeholder="模糊搜索" />
          </div>
          <div class="filter-item">
            <label for="f-nickname">昵称</label>
            <input id="f-nickname" type="text" placeholder="模糊搜索" />
          </div>
          <div class="filter-item">
            <label for="f-role">角色</label>
            <select id="f-role">
              <option value="">全部</option>
              <option value="admin">管理员</option>
              <option value="user">普通用户</option>
              <option value="test">测试用户</option>
            </select>
          </div>
          <div class="filter-item">
            <label for="f-status">状态</label>
            <select id="f-status">
              <option value="">全部</option>
              <option value="normal">正常</option>
              <option value="banned">已封禁</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="btn-secondary" id="btn-user-reset" type="button">重置</button>
            <button class="btn-primary" id="btn-user-query" type="button">查询</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-id">ID</th>
                <th>用户名</th>
                <th>昵称</th>
                <th>头像</th>
                <th>角色</th>
                <th>状态</th>
                <th>密码</th>
                <th>注册时间</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="users-empty">暂无用户</div>
        <div class="loading" id="users-loading"><span class="spinner"></span>加载中…</div>
      </section>

      <!-- ===================== 消息管理 ===================== -->
      <section class="panel hidden" id="panel-messages">
        <div class="panel-toolbar">
          <button class="btn-action btn-danger" id="btn-batch-delete" type="button" disabled>批量删除</button>
          <span class="batch-count" id="batch-count">未选择消息</span>
        </div>

        <div class="filter-bar">
          <div class="filter-item">
            <label for="f-start">开始时间</label>
            <input id="f-start" type="datetime-local" />
          </div>
          <div class="filter-item">
            <label for="f-end">结束时间</label>
            <input id="f-end" type="datetime-local" />
          </div>
          <div class="filter-item">
            <label for="f-sender">发送者</label>
            <input id="f-sender" type="text" placeholder="昵称模糊搜索" />
          </div>
          <div class="filter-item">
            <label for="f-msg-status">消息状态</label>
            <select id="f-msg-status">
              <option value="">全部</option>
              <option value="0">正常</option>
              <option value="1">用户撤回</option>
              <option value="2">管理员撤回</option>
              <option value="3">已删除</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="btn-secondary" id="btn-msg-reset" type="button">重置</button>
            <button class="btn-primary" id="btn-msg-query" type="button">查询</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-check"><input type="checkbox" id="check-all" title="全选" /></th>
                <th class="col-id">ID</th>
                <th>发送者</th>
                <th>类型</th>
                <th class="col-content">内容</th>
                <th>时间</th>
                <th>状态</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="messages-body"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="messages-empty">暂无消息</div>
        <div class="loading" id="messages-loading"><span class="spinner"></span>加载中…</div>
      </section>
    </main>
  </div>

  <!-- ===================== 确认弹窗 ===================== -->
  <div class="modal-overlay hidden" id="confirm-modal">
    <div class="modal">
      <h3 id="confirm-title">确认操作</h3>
      <p class="confirm-text" id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn-secondary" id="confirm-cancel" type="button">取消</button>
        <button class="btn-danger" id="confirm-ok" type="button">确认</button>
      </div>
    </div>
  </div>

  <!-- ===================== 创建测试用户弹窗 ===================== -->
  <div class="modal-overlay hidden" id="create-modal">
    <div class="modal">
      <div class="modal-head">
        <h3>创建测试用户</h3>
        <button class="btn-icon" id="btn-create-close" title="关闭" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div id="create-form-wrap">
        <div class="field">
          <label for="create-username">用户名</label>
          <input id="create-username" type="text" placeholder="2-20 个字符" maxlength="20" />
        </div>
        <div class="field">
          <label for="create-password">密码</label>
          <input id="create-password" type="text" placeholder="6-64 个字符" maxlength="64" />
        </div>
        <div class="field">
          <label for="create-nickname">昵称 <span class="optional">选填，默认同用户名</span></label>
          <input id="create-nickname" type="text" placeholder="昵称" maxlength="20" />
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="btn-create-cancel" type="button">取消</button>
          <button class="btn-primary" id="btn-create-submit" type="button">创建</button>
        </div>
      </div>

      <div id="create-result-wrap" class="hidden">
        <p class="result-tip">测试用户创建成功，请保存以下明文密码（用于分发/登录测试）：</p>
        <div class="password-display">
          <code id="create-result-password"></code>
          <button class="btn-secondary btn-sm" id="btn-copy-password" type="button">复制</button>
        </div>
        <div class="modal-actions">
          <button class="btn-primary btn-block" id="btn-create-done" type="button">完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status"></div>

  <script src="./js/app.js"></script>
</body>
</html>
